<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">The Evolution of Computers</title><desc id="desc">Educational vector illustration showing five commonly taught computer generations: vacuum tubes, transistors, integrated circuits, microprocessors, and AI-oriented computing.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eaf2ff"/></linearGradient><style>
.h{font:700 52px Arial,sans-serif;fill:#12356b}.sub{font:26px Arial,sans-serif;fill:#466080}.lab{font:700 27px Arial,sans-serif;fill:white}.desc{font:22px Arial,sans-serif;fill:#18314f}.small{font:19px Arial,sans-serif;fill:#466080}.card{stroke-width:3;rx:24}.machine{fill:#d8e1ea;stroke:#52677c;stroke-width:7}.dark{fill:#243b53}.tube{fill:#ffdc8a;stroke:#9b6b20;stroke-width:4}.chip{fill:#344c68;stroke:#142b45;stroke-width:4}.line{stroke:#1876c9;stroke-width:8;fill:none;stroke-linecap:round;stroke-linejoin:round}
</style></defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<text x="800" y="82" text-anchor="middle" class="h">The Evolution of Computers</text><text x="800" y="126" text-anchor="middle" class="sub">From early electronic machines to AI-oriented computing</text>
<g transform="translate(30 170)">
<rect width="292" height="560" class="card" fill="#e6f3ff" stroke="#1681c9"/><rect width="292" height="76" rx="22" fill="#147dc0"/><text x="146" y="48" text-anchor="middle" class="lab">1st Generation</text>
<text x="146" y="116" text-anchor="middle" class="desc" font-weight="bold">Vacuum tubes</text>
<rect x="35" y="155" width="222" height="210" rx="12" class="machine"/><rect x="50" y="170" width="192" height="150" rx="6" fill="#263d52"/>
<g><rect x="66" y="183" width="17" height="24" rx="7" class="tube"/><rect x="100" y="183" width="17" height="24" rx="7" class="tube"/><rect x="134" y="183" width="17" height="24" rx="7" class="tube"/><rect x="168" y="183" width="17" height="24" rx="7" class="tube"/><rect x="202" y="183" width="17" height="24" rx="7" class="tube"/><rect x="66" y="215" width="17" height="24" rx="7" class="tube"/><rect x="100" y="215" width="17" height="24" rx="7" class="tube"/><rect x="134" y="215" width="17" height="24" rx="7" class="tube"/><rect x="168" y="215" width="17" height="24" rx="7" class="tube"/><rect x="202" y="215" width="17" height="24" rx="7" class="tube"/><rect x="66" y="247" width="17" height="24" rx="7" class="tube"/><rect x="100" y="247" width="17" height="24" rx="7" class="tube"/><rect x="134" y="247" width="17" height="24" rx="7" class="tube"/><rect x="168" y="247" width="17" height="24" rx="7" class="tube"/><rect x="202" y="247" width="17" height="24" rx="7" class="tube"/><rect x="66" y="279" width="17" height="24" rx="7" class="tube"/><rect x="100" y="279" width="17" height="24" rx="7" class="tube"/><rect x="134" y="279" width="17" height="24" rx="7" class="tube"/><rect x="168" y="279" width="17" height="24" rx="7" class="tube"/><rect x="202" y="279" width="17" height="24" rx="7" class="tube"/></g><rect x="64" y="333" width="164" height="16" rx="5" class="dark"/>
<text x="26" y="420" class="desc">• Very large machines</text><text x="26" y="462" class="desc">• Produced much heat</text><text x="26" y="504" class="desc">• Used much electricity</text><text x="26" y="540" class="small">Punched cards / printouts</text>
</g>
<g transform="translate(343 170)">
<rect width="292" height="560" class="card" fill="#eaf7e9" stroke="#38a34a"/><rect width="292" height="76" rx="22" fill="#329b43"/><text x="146" y="48" text-anchor="middle" class="lab">2nd Generation</text>
<text x="146" y="116" text-anchor="middle" class="desc" font-weight="bold">Transistors</text>
<rect x="35" y="155" width="222" height="210" rx="12" class="machine"/><rect x="51" y="172" width="190" height="150" rx="6" fill="#30495e"/>
<g><circle cx="68" cy="190" r="8" fill="#e6b85c" stroke="#f8e6b7" stroke-width="3"/><circle cx="94" cy="190" r="8" fill="#e6b85c" stroke="#f8e6b7" stroke-width="3"/><circle cx="120" cy="190" r="8" fill="#e6b85c" stroke="#f8e6b7" stroke-width="3"/><circle cx="146" cy="190" r="8" fill="#e6b85c" stroke="#f8e6b7" stroke-width="3"/><circle cx="172" cy="190" r="8" fill="#e6b85c" stroke="#f8e6b7" stroke-width="3"/><circle cx="198" cy="190" r="8" fill="#e6b85c" stroke="#f8e6b7" stroke-width="3"/><circle cx="224" cy="190" r="8" fill="#e6b85c" stroke="#f8e6b7" stroke-width="3"/><circle cx="68" cy="224" r="8" fill="#e6b85c" stroke="#f8e6b7" stroke-width="3"/><circle cx="94" cy="224" r="8" fill="#e6b85c" stroke="#f8e6b7" stroke-width="3"/><circle cx="120" cy="224" r="8" fill="#e6b85c" stroke="#f8e6b7" stroke-width="3"/><circle cx="146" cy="224" r="8" fill="#e6b85c" stroke="#f8e6b7" stroke-width="3"/><circle cx="172" cy="224" r="8" fill="#e6b85c" stroke="#f8e6b7" stroke-width="3"/><circle cx="198" cy="224" r="8" fill="#e6b85c" stroke="#f8e6b7" stroke-width="3"/><circle cx="224" cy="224" r="8" fill="#e6b85c" stroke="#f8e6b7" stroke-width="3"/><circle cx="68" cy="258" r="8" fill="#e6b85c" stroke="#f8e6b7" stroke-width="3"/><circle cx="94" cy="258" r="8" fill="#e6b85c" stroke="#f8e6b7" stroke-width="3"/><circle cx="120" cy="258" r="8" fill="#e6b85c" stroke="#f8e6b7" stroke-width="3"/><circle cx="146" cy="258" r="8" fill="#e6b85c" stroke="#f8e6b7" stroke-width="3"/><circle cx="172" cy="258" r="8" fill="#e6b85c" stroke="#f8e6b7" stroke-width="3"/><circle cx="198" cy="258" r="8" fill="#e6b85c" stroke="#f8e6b7" stroke-width="3"/><circle cx="224" cy="258" r="8" fill="#e6b85c" stroke="#f8e6b7" stroke-width="3"/><circle cx="68" cy="292" r="8" fill="#e6b85c" stroke="#f8e6b7" stroke-width="3"/><circle cx="94" cy="292" r="8" fill="#e6b85c" stroke="#f8e6b7" stroke-width="3"/><circle cx="120" cy="292" r="8" fill="#e6b85c" stroke="#f8e6b7" stroke-width="3"/><circle cx="146" cy="292" r="8" fill="#e6b85c" stroke="#f8e6b7" stroke-width="3"/><circle cx="172" cy="292" r="8" fill="#e6b85c" stroke="#f8e6b7" stroke-width="3"/><circle cx="198" cy="292" r="8" fill="#e6b85c" stroke="#f8e6b7" stroke-width="3"/><circle cx="224" cy="292" r="8" fill="#e6b85c" stroke="#f8e6b7" stroke-width="3"/></g><rect x="64" y="333" width="164" height="16" rx="5" class="dark"/>
<text x="26" y="420" class="desc">• Smaller than tube systems</text><text x="26" y="462" class="desc">• More reliable</text><text x="26" y="504" class="desc">• Less heat and power</text><text x="26" y="540" class="small">Transistor circuits</text>
</g>
<g transform="translate(656 170)">
<rect width="292" height="560" class="card" fill="#f2eaff" stroke="#8d4bc1"/><rect width="292" height="76" rx="22" fill="#8040b4"/><text x="146" y="48" text-anchor="middle" class="lab">3rd Generation</text>
<text x="146" y="116" text-anchor="middle" class="desc" font-weight="bold">Integrated circuits</text>
<rect x="35" y="155" width="222" height="210" rx="12" class="machine"/><rect x="51" y="172" width="190" height="150" rx="6" fill="#30495e"/>
<g><rect x="70" y="190" width="38" height="42" rx="5" class="chip"/><path d="M76 185v-8m12 8v-8m12 8v-8m12 8v-8" stroke="#d5dde7" stroke-width="3"/><rect x="127" y="190" width="38" height="42" rx="5" class="chip"/><path d="M133 185v-8m12 8v-8m12 8v-8m12 8v-8" stroke="#d5dde7" stroke-width="3"/><rect x="184" y="190" width="38" height="42" rx="5" class="chip"/><path d="M190 185v-8m12 8v-8m12 8v-8m12 8v-8" stroke="#d5dde7" stroke-width="3"/><rect x="70" y="252" width="38" height="42" rx="5" class="chip"/><path d="M76 247v-8m12 8v-8m12 8v-8m12 8v-8" stroke="#d5dde7" stroke-width="3"/><rect x="127" y="252" width="38" height="42" rx="5" class="chip"/><path d="M133 247v-8m12 8v-8m12 8v-8m12 8v-8" stroke="#d5dde7" stroke-width="3"/><rect x="184" y="252" width="38" height="42" rx="5" class="chip"/><path d="M190 247v-8m12 8v-8m12 8v-8m12 8v-8" stroke="#d5dde7" stroke-width="3"/></g><rect x="64" y="333" width="164" height="16" rx="5" class="dark"/>
<text x="26" y="420" class="desc">• Many components on chips</text><text x="26" y="462" class="desc">• Faster processing</text><text x="26" y="504" class="desc">• Improved reliability</text><text x="26" y="540" class="small">Compact IC technology</text>
</g>
<g transform="translate(969 170)">
<rect width="292" height="560" class="card" fill="#e3f8f5" stroke="#169d8a"/><rect width="292" height="76" rx="22" fill="#118d7d"/><text x="146" y="48" text-anchor="middle" class="lab">4th Generation</text>
<text x="146" y="116" text-anchor="middle" class="desc" font-weight="bold">Microprocessors</text>
<rect x="40" y="170" width="212" height="140" rx="12" fill="#c8d3df" stroke="#52677c" stroke-width="7"/><rect x="55" y="185" width="182" height="108" rx="5" fill="#2566a8"/><path d="M70 270h150" stroke="#d6eaff" stroke-width="4"/><rect x="125" y="310" width="42" height="25" fill="#7b8fa4"/><rect x="88" y="335" width="118" height="12" rx="6" fill="#52677c"/><rect x="42" y="365" width="210" height="22" rx="6" fill="#d4dde7" stroke="#52677c" stroke-width="4"/>
<text x="26" y="445" class="desc">• CPU on a single chip</text><text x="26" y="487" class="desc">• Personal computers</text><text x="26" y="529" class="desc">• Home and office use</text>
</g>
<g transform="translate(1282 170)">
<rect width="288" height="560" class="card" fill="#fff0df" stroke="#e78a19"/><rect width="288" height="76" rx="22" fill="#e88912"/><text x="144" y="48" text-anchor="middle" class="lab">5th Generation</text>
<text x="144" y="116" text-anchor="middle" class="desc" font-weight="bold">AI-oriented computing</text>
<rect x="28" y="190" width="155" height="115" rx="10" fill="#263e5b" stroke="#607d9b" stroke-width="7"/><rect x="40" y="202" width="131" height="91" rx="5" fill="#0b2b56"/><text x="105" y="260" text-anchor="middle" font-family="Arial" font-size="42" font-weight="bold" fill="#55d9ff">AI</text><path d="M80 310h50l20 22H60z" fill="#8fa4b8" stroke="#52677c" stroke-width="4"/>
<circle cx="225" cy="230" r="48" fill="#c8d9e8" stroke="#52677c" stroke-width="6"/><circle cx="209" cy="224" r="7" fill="#1877c9"/><circle cx="241" cy="224" r="7" fill="#1877c9"/><path d="M208 249q17 15 34 0" stroke="#52677c" stroke-width="5" fill="none"/>
<text x="24" y="420" class="desc">• AI and data-driven tools</text><text x="24" y="462" class="desc">• Language and vision systems</text><text x="24" y="504" class="desc">• Rapidly evolving technology</text><text x="24" y="540" class="small">A broad teaching category</text>
</g>
<path d="M322 450h18m-8 -9 9 9 -9 9 M635 450h18m-8 -9 9 9 -9 9 M948 450h18m-8 -9 9 9 -9 9 M1261 450h18m-8 -9 9 9 -9 9" class="line"/>
<rect x="80" y="780" width="1440" height="72" rx="22" fill="#dceaff" stroke="#5b9ce4" stroke-width="3"/><text x="800" y="825" text-anchor="middle" class="desc" font-weight="bold">Key idea: Computers generally became smaller, faster, more reliable and more capable over time.</text>
<text x="800" y="885" text-anchor="middle" class="small">Educational illustration • Generations and date ranges vary between textbooks</text>
</svg>